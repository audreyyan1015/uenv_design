components:
  agents/plain:
    version: 1.0.0
    role: agent
    config_schema: uenv://schemas/vnext/PlainAgentConfig
  agents/openhands:
    version: 1.0.0
    role: agent
    config_schema: uenv://schemas/vnext/OpenHandsAgentConfig
    provided_tools:
      terminal:
        config_schema: uenv://schemas/vnext/ToolConfig
        execution_scope: sandbox
        required_capabilities:
        - exec.v1
        - filesystem.v1
      file-editor:
        config_schema: uenv://schemas/vnext/ToolConfig
        execution_scope: sandbox
        required_capabilities:
        - exec.v1
        - filesystem.v1
      task-tracker:
        config_schema: uenv://schemas/vnext/EmptyConfig
        execution_scope: agent_state
        required_capabilities: []
      finish:
        config_schema: uenv://schemas/vnext/EmptyConfig
        execution_scope: agent_state
        required_capabilities: []
  backends/process:
    version: 1.0.0
    role: backend
    config_schema: uenv://schemas/vnext/ProcessBackendConfig
    consumes_image: false
  backends/docker:
    version: 1.0.0
    role: backend
    config_schema: uenv://schemas/vnext/ContainerBackendConfig
    consumes_image: true
  backends/podman:
    version: 1.0.0
    role: backend
    config_schema: uenv://schemas/vnext/ContainerBackendConfig
    consumes_image: true
