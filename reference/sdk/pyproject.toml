[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "uenv-sdk-reference"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "protobuf>=6.33.5,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"uenv.sdk" = ["resources/*.json", "resources/extensions/*.json"]
